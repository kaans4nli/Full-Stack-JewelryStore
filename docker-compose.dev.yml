version: '3.8'

services:
  db:
    image: postgres:15
    container_name: login_db_container
    restart: always
    env_file:
      - login-backend/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend_network

  backend:
    build:
      context: ./login-backend
      dockerfile: Dockerfile.dev
    container_name: login_backend_dev
    working_dir: /app
    volumes:
      - ./login-backend:/app           # Kod değişikliklerini alabilmek için mount
      - ~/.m2:/root/.m2                # Maven cache
      - ./login-backend/uploads:/app/uploads
    ports:
      - "8080:8080"
    env_file:
      - login-backend/.env
    depends_on:
      - db
    networks:
      - backend_network

  frontend:
    build:
      context: ../login-frontend
      dockerfile: Dockerfile.dev
    container_name: react_frontend_dev
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ../login-frontend:/app          # Kod değişikliklerini alabilmek için mount
      - /app/node_modules              # host node_modules override etmesin
    environment:
      - CHOKIDAR_USEPOLLING=true      # hot reload
    depends_on:
      - backend
    networks:
      - backend_network

volumes:
  pgdata:

networks:
  backend_network:
    driver: bridge
