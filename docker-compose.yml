version: '3.8'

services:
  db:
    image: postgres:15
    container_name: login_db_container
    restart: always
    env_file:
      - login-backend/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend_network

  backend:
    build:
      context: login-backend
    container_name: login_backend_container
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    env_file:
      - login-backend/.env
    networks:
      - backend_network

  frontend:
    build:
      context: ../login-frontend
    container_name: react_frontend_container
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - backend_network

volumes:
  pgdata:

networks:
  backend_network:
    driver: bridge